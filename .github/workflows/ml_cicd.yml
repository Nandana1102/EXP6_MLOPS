name: CI/CD for ML Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-train-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
      - name: Run tests
        run: |
          source venv/bin/activate
          pytest -v
      - name: Train all models
        run: |
          source venv/bin/activate
          mkdir artifacts
          python train_pipeline.py random_forest
          python train_pipeline.py decision_tree
          python train_pipeline.py linear_regression
      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: artifacts/
